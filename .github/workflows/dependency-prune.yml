name: Dependency Prune

on:
  push:
    branches:
      - refactor/performance-redesign

permissions:
  contents: write

jobs:
  prune:
    if: ${{ !contains(github.event.head_commit.message, 'chore: prune unused dependencies') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/performance-redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused runtime dependencies
        run: >-
          npm uninstall
          @hookform/resolvers
          @react-three/drei
          @react-three/fiber
          @react-three/postprocessing
          @types/three
          clsx
          framer-motion
          lenis
          react-hook-form
          react-intersection-observer
          tailwind-merge
          three

      - name: Commit regenerated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: prune unused dependencies"
          git push origin HEAD:refactor/performance-redesign

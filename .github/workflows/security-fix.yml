name: Security Fix

on:
  push:
    branches:
      - refactor/performance-redesign

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/performance-redesign

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible security updates
        run: npm audit fix

      - name: Verify no critical runtime advisories remain
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit regenerated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply dependency security updates"
          git push origin HEAD:refactor/performance-redesign
